[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "supportlora"
version = "1.0.0"
description = "LoRA fine-tuning of TinyLlama-1.1B-Chat as a customer-support assistant, with before/after evaluation"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0"]

[project.optional-dependencies]
train = ["torch>=2.2", "transformers>=4.45", "peft>=0.12", "accelerate>=0.33", "datasets>=2.20"]
app = ["gradio>=4.0"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
